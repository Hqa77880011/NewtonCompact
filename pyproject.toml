[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-compact"
version = "0.1.0"
description = "Newton-Consistent Neural Compact Models for Reliable Cross-Technology MOSFET Simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
newton-compact = "newton_compact.cli:main"

[tool.setuptools.packages.find]
include = ["newton_compact*"]
